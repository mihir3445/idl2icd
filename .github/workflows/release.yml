name: Release (build & deploy example ICD site)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WeasyPrint system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -e ".[pdf,docx]"
      - run: idl2icd build --config examples/robot-fleet/idl2icd.yaml --format all
      - run: idl2icd schema --out-dir schemas
      - run: idl2icd snapshot save --config examples/robot-fleet/idl2icd.yaml --tag ${{ github.ref_name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/robot-fleet/dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Commit frozen snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/robot-fleet/.idl2icd/snapshots schemas
          git commit -m "chore: snapshot ${{ github.ref_name }}" || echo "nothing to commit"
          git push
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            examples/robot-fleet/dist/icd.pdf
            examples/robot-fleet/dist/icd.docx