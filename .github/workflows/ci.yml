name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - run: ruff check .

  build-example:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WeasyPrint system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -e ".[pdf,docx]"
      - name: Validate example project
        run: idl2icd validate --config examples/robot-fleet/idl2icd.yaml
      - name: Build example (site + pdf + docx)
        run: idl2icd build --config examples/robot-fleet/idl2icd.yaml --format all
      - uses: actions/upload-artifact@v4
        with:
          name: example-site
          path: examples/robot-fleet/dist