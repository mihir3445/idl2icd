[project]
name = "idl2icd"
version = "0.1.0"
description = "Generate a website + PDF Interface Control Document from OMG IDL + metadata for DDS systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mihir Patel" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
keywords = ["idl", "dds", "documentation", "icd", "weasyprint", "python-docx"]
dependencies = [
    "lark>=1.1.9",
    "pydantic>=2.6",
    "typer>=0.12",
    "jinja2>=3.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pluggy>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "jsonschema>=4.21"]
pdf = ["weasyprint>=61.0"]
docx = ["python-docx>=1.1"]

[project.scripts]
idl2icd = "idl2icd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
